        }

        }

            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
        <!-- Input Area Collapsible / Controls -->
        <section class="bg-gray-800 rounded-2xl p-4 sm:p-6 border border-gray-700 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <label for="raw-input" class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-code text-blue-400"></i> Dữ liệu thẻ đầu vào:
                </label>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <button id="btn-load-default" class="flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-medium bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-lg transition-all flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-import"></i> Khôi phục dữ liệu mẫu (success.txt)
                    </button>
                    <button id="btn-clear" class="px-3.5 py-1.5 text-xs font-medium bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/40 rounded-lg transition-all flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> Xóa tất cả
                    </button>
                </div>
            </div>

            <!-- Upload File Dropzone & Textarea Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Dropzone Upload Area -->
                <div id="drop-zone" class="md:col-span-1 border-2 border-dashed border-gray-600 hover:border-blue-500 bg-gray-900/50 hover:bg-blue-500/5 rounded-xl p-4 flex flex-col justify-center items-center text-center cursor-pointer transition-all group">
                    <input type="file" id="file-input" accept=".txt" class="hidden">
                    <div class="p-3 bg-blue-500/10 text-blue-400 rounded-full mb-2 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-200 mb-1">Tải lên file dữ liệu (.txt)</p>
                    <p class="text-[11px] text-gray-400">Kéo thả file .txt vào đây hoặc <span class="text-blue-400 underline">duyệt file</span></p>
                    <span id="file-name" class="mt-2 text-[11px] text-emerald-400 font-mono hidden truncate max-w-full"></span>
                </div>

                <!-- Textarea Area -->
                <div class="md:col-span-2">
                    <textarea id="raw-input" rows="4" class="w-full h-full min-h-[110px] bg-gray-900/90 border border-gray-700 rounded-xl p-3 text-xs font-mono text-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all resize-y" placeholder="Hoặc dán trực tiếp danh sách thẻ tại đây (Định dạng: card_number|expiration|cvc|holder_name|country|brand|funding|segment_type)..."></textarea>
                </div>
            </div>

            <!-- Notice Banner for Expired & Duplicate Cards -->
            <div id="filter-summary-banner" class="hidden p-3 bg-blue-900/30 border border-blue-500/40 rounded-xl text-xs flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center space-x-2 text-blue-300">
                    <i class="fa-solid fa-circle-info text-sm"></i>
                    <span>Thống kê lọc dữ liệu tự động:</span>
                </div>
                <div class="flex flex-wrap items-center gap-2 font-medium">
                    <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded" id="stat-valid">Hợp lệ: 0</span>
                    <span class="px-2 py-0.5 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded" id="stat-expired">Đã loại hết hạn: 0</span>
                    <span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded" id="stat-duplicate">Đã loại trùng lặp: 0</span>
                </div>
            </div>

            <div class="flex justify-between items-center pt-1">
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-gray-400 font-medium">Chế độ gom nhóm (Group By):</span>
                    <select id="group-by" class="bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-blue-400 font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="country">Quốc gia (Country)</option>
                        <option value="funding">Loại thẻ (Funding)</option>
                        <option value="segmentType">Phân khúc (Segment)</option>
                        <option value="brand">Thương hiệu (Brand)</option>
                    </select>
                </div>

            </div>
        </section>

        </section>

        <!-- Control Bar: Group By & Search -->
        <section class="bg-gray-800 rounded-2xl p-4 sm:p-5 border border-gray-700 shadow-lg space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                
                <!-- Group By Option -->
                <div>
                    <label class="block text-xs font-semibold text-blue-400 mb-1">
                        <i class="fa-solid fa-layer-group"></i> Gom nhóm theo (Group By)
                    </label>
                    <select id="group-by-select" class="w-full bg-gray-900 border border-blue-500/50 rounded-lg px-3 py-2 text-xs font-medium text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="country" selected>Quốc gia (Country) [Mặc định]</option>
                        <option value="funding">Loại thẻ (Funding)</option>
                        <option value="segmentType">Phân khúc (Segment Type)</option>
                        <option value="brand">Thương hiệu (Brand)</option>
                    </select>
                </div>

                <!-- Search Input -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">
                        <i class="fa-solid fa-magnifying-glass"></i> Tìm theo Số Thẻ
                    </label>
                    <div class="relative">
                        <input type="text" id="search-card" placeholder="Nhập số thẻ..." class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-9 pr-3 py-2 text-xs text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        <i class="fa-solid fa-credit-card absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                    </div>
                </div>

                <!-- Sort Order within Groups -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">
                        <i class="fa-solid fa-arrow-down-a-z"></i> Sắp xếp trong nhóm
                    </label>
                    <select id="sort-in-group" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="card-asc">Số thẻ (Tăng dần)</option>
                        <option value="exp-asc">Hạn sử dụng (Gần -> Xa)</option>
                    </select>
                </div>

                <!-- Expand/Collapse All & Bulk Action -->
                <div class="flex items-end gap-2">
                    <button id="btn-toggle-all" class="flex-1 py-2 px-3 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded-lg text-xs font-medium transition-all flex items-center justify-center gap-1">
                        <i class="fa-solid fa-angles-up" id="toggle-all-icon"></i> <span id="toggle-all-text">Thu gọn tất cả</span>
                    </button>
                    <button id="btn-copy-all-visible" class="py-2 px-3 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 rounded-lg text-xs font-medium transition-all flex items-center justify-center gap-1.5" title="Copy tất cả thẻ đang lọc">
                        <i class="fa-regular fa-copy"></i> Copy tất cả
                    </button>
                </div>
            </div>
        </section>

        <!-- Grouped Cards Accordion Container -->
        <section id="groups-container" class="space-y-4">
            <!-- Dynamic Groups will be inserted here -->
        </section>

        <!-- Empty State Message -->

            <p class="text-gray-400 font-medium text-sm">Không tìm thấy thẻ nào phù hợp!</p>
        </div>
    </main>

        <span id="toast-message" class="text-sm font-semibold">Đã copy vào bộ nhớ tạm!</span>
    </div>

    <!-- Hidden Copy Field -->
    <textarea id="hidden-copy-area" class="sr-only" aria-hidden="true"></textarea>

        // Check Card Expiration Date (Format: MM/YY or MM/YYYY) against VN / Local Current Date
        function isCardExpired(expStr) {
            if (!expStr || !expStr.includes('/')) return false;

            const parts = expStr.split('/');
            const expMonth = parseInt(parts[0], 10);
            let expYear = parseInt(parts[1], 10);

            if (isNaN(expMonth) || isNaN(expYear)) return false;

            // Normalize 2-digit year to 4-digit year (e.g. 26 -> 2026)
            if (expYear < 100) {
                expYear += 2000;
            }

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; // 1-12

            if (expYear < currentYear) return true;
            if (expYear === currentYear && expMonth < currentMonth) return true;

            return false;
        }

            const uniqueCardsSet = new Set();

            if (rawText) {
                const lines = rawText.split('\n');
                lines.forEach((line, index) => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;

                    const parts = trimmedLine.split('|').map(item => item.trim());

                    if (parts.length >= 3) {
                        const cardNumber = parts[0] || '';
                        const expiration = parts[1] || '';
                        const cvc = parts[2] || '';

                        // 1. Check expiration
                        if (isCardExpired(expiration)) {
                            expiredCount++;
                            return; // Skip expired
                        }

                        // 2. Check duplicates (card_number|expiration|cvc)
                        const uniqueKey = `${cardNumber}|${expiration}|${cvc}`;
                        if (uniqueCardsSet.has(uniqueKey)) {
                            duplicateCount++;
                            return; // Skip duplicate
                        }

                        uniqueCardsSet.add(uniqueKey);

                        parsedCards.push({
                            id: index,
                            cardNumber: cardNumber,
                            expiration: expiration,
                            cvc: cvc,
                            holderName: parts[3] || 'N/A',
                            country: (parts[4] || 'UNKNOWN').toUpperCase(),
                            brand: (parts[5] || 'OTHER').toUpperCase(),
                            funding: (parts[6] || 'UNKNOWN').toUpperCase(),
                            segmentType: (parts[7] || 'UNKNOWN').toUpperCase(),
                            rawString: uniqueKey
                        });
                    }
                });

                lines.forEach((line) => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;

                    const parts = trimmedLine.split('|').map(item => item.trim());

                    if (parts.length >= 3) {
                        const cardNumber = parts[0] || '';
                        const expiration = parts[1] || '';
                        const cvc = parts[2] || '';
                        const holderName = parts[3] || 'N/A';
                        const country = (parts[4] || 'UNKNOWN').toUpperCase();
                        const brand = (parts[5] || 'OTHER').toUpperCase();
                        const funding = (parts[6] || 'UNKNOWN').toUpperCase();
                        const segmentType = (parts[7] || 'UNKNOWN').toUpperCase();
                        
                        // 1. Deduplication Check (card_number|expiration|cvc)
                        const cardUniqueKey = `${cardNumber}|${expiration}|${cvc}`;
                        if (seenCards.has(cardUniqueKey)) {
                            duplicateCount++;
                            return; // Skip duplicate
                        }

                        // 2. Expiration Check
                        if (isCardExpired(expiration)) {
                            expiredCount++;
                            return; // Skip expired card
                        }

                        // Valid Card
                        seenCards.add(cardUniqueKey);
                        validCards.push({
                            cardNumber,
                            expiration,
                            cvc,
                            holderName,
                            country,
                            brand,
                            funding,
                            segmentType,
                            rawString: cardUniqueKey
                        });
                    }
                });
            }

            // Update Summary Banner UI
            updateSummaryBanner(linesLength = rawText ? rawText.split('\n').filter(l => l.trim()).length : 0);
            renderGroupedUI();
        }

        // Update Summary Banner Info
        function updateSummaryBanner(totalInputLines) {
            validCountEl.textContent = validCards.length;

            if (expiredCount > 0 || duplicateCount > 0) {
                filterSummaryBanner.classList.remove('hidden');
                summaryText.innerHTML = `Đã phân tích <strong>${totalInputLines}</strong> thẻ. Đã tự động lọc thành công <strong>${validCards.length}</strong> thẻ còn hạn.`;
                badgeExpired.textContent = `${expiredCount} Hết hạn`;
                badgeDuplicate.textContent = `${duplicateCount} Trùng lặp`;
            } else {
                if (validCards.length > 0) {
                    filterSummaryBanner.classList.remove('hidden');
                    summaryText.innerHTML = `Tất cả <strong>${validCards.length}</strong> thẻ nhập vào đều hợp lệ và chưa hết hạn!`;
                    badgeExpired.textContent = `0 Hết hạn`;
                    badgeDuplicate.textContent = `0 Trùng lặp`;
                } else {
                    filterSummaryBanner.classList.add('hidden');
                }
            }
        }

        // Render Cards Grouped into Accordions
        function renderGroupedUI() {
            groupsContainer.innerHTML = '';
            const searchTerm = searchCard.value.trim().toLowerCase();
            const groupByKey = groupBySelect.value;
            const sortOrder = sortInGroupSelect.value;

            // Filter cards by search input
            let filteredCards = validCards.filter(c => c.cardNumber.toLowerCase().includes(searchTerm));
            displayedCountEl.textContent = filteredCards.length;

            if (filteredCards.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Grouping Logic
            const groupsMap = {};
            filteredCards.forEach(card => {
                const groupVal = card[groupByKey] || 'UNKNOWN';
                if (!groupsMap[groupVal]) {
                    groupsMap[groupVal] = [];
                }
                groupsMap[groupVal].push(card);
            });

            // Sort Group Names A-Z
            const sortedGroupKeys = Object.keys(groupsMap).sort((a, b) => a.localeCompare(b));

            sortedGroupKeys.forEach((groupKey, index) => {
                let cardList = groupsMap[groupKey];

                // Sort Cards inside Group
                cardList.sort((a, b) => {
                    if (sortOrder === 'card-asc') return a.cardNumber.localeCompare(b.cardNumber);
                    if (sortOrder === 'exp-asc') return a.expiration.localeCompare(b.expiration);
                    return 0;
                });

                // Generate Group Header Meta (e.g. Flag for Country group)
                let groupIconOrFlag = '';
                if (groupByKey === 'country') {
                    const flagUrl = groupKey !== 'UNKNOWN' 
                        ? `https://flagcdn.com/w40/${groupKey.toLowerCase()}.png`
                        : 'https://placehold.co/40x30/374151/9CA3AF?text=?';
                    groupIconOrFlag = `<img src="${flagUrl}" alt="${groupKey}" class="w-6 h-4 object-cover rounded shadow-sm inline-block mr-2" onerror="this.src='https://placehold.co/40x30/374151/9CA3AF?text=?';">`;
                } else if (groupByKey === 'brand') {
                    groupIconOrFlag = `<i class="fa-solid fa-credit-card text-blue-400 mr-2"></i>`;
                } else if (groupByKey === 'funding') {
                    groupIconOrFlag = `<i class="fa-solid fa-wallet text-emerald-400 mr-2"></i>`;
                } else {
                    groupIconOrFlag = `<i class="fa-solid fa-briefcase text-purple-400 mr-2"></i>`;
                }

                // Accordion Element construction
                const details = document.createElement('details');
                details.className = 'bg-gray-800 rounded-2xl border border-gray-700 overflow-hidden shadow-lg group transition-all';
                details.open = isAllExpanded;

                const summary = document.createElement('summary');
                summary.className = 'cursor-pointer p-4 bg-gray-800 hover:bg-gray-750 flex items-center justify-between font-bold text-sm select-none transition-colors border-b border-gray-700/50';

                // Raw string list for copy group button
                const groupRawPipeText = cardList.map(c => c.rawString).join('\n');

                summary.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-chevron-right text-xs text-gray-500 transition-transform group-open:rotate-90"></i>
                        <div class="flex items-center">
                            ${groupIconOrFlag}
                            <span class="text-base font-bold text-gray-100">${groupKey}</span>
                        </div>
                        <span class="bg-blue-900/60 text-blue-300 border border-blue-700/50 text-xs px-2.5 py-0.5 rounded-full font-mono">${cardList.length} thẻ</span>
                    </div>
                    <button onclick="event.preventDefault(); copyToClipboard('${escapeJsString(groupRawPipeText)}'); showToast('Đã copy ${cardList.length} thẻ nhóm ${groupKey}!');" 
                        class="px-3 py-1 bg-gray-700 hover:bg-blue-600 text-gray-300 hover:text-white rounded-lg text-xs font-normal transition-all flex items-center gap-1.5 shadow-sm">
                        <i class="fa-regular fa-copy"></i> Copy Nhóm
                    </button>
                `;

                // Cards Grid Content inside Group Accordion
                const cardsGrid = document.createElement('div');
                cardsGrid.className = 'p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 bg-gray-900/40';

                cardList.forEach(card => {
                    const cardCard = document.createElement('div');
                    cardCard.className = 'bg-gray-800 rounded-xl p-4 border border-gray-700 hover:border-blue-500/50 transition-all shadow-md hover:shadow-xl flex flex-col justify-between space-y-3';

                    // Brand Badge Class
                    let brandBadge = 'bg-gray-700 text-gray-300';
                    if (card.brand === 'VISA') brandBadge = 'bg-blue-900/60 text-blue-300 border-blue-700/50';
                    else if (card.brand === 'MASTERCARD') brandBadge = 'bg-orange-900/60 text-orange-300 border-orange-700/50';
                    else if (card.brand === 'AMERICAN_EXPRESS') brandBadge = 'bg-emerald-900/60 text-emerald-300 border-emerald-700/50';

                    // Funding Badge Class
                    let fundingBadge = 'bg-gray-700/60 text-gray-300';
                    if (card.funding === 'CREDIT') fundingBadge = 'bg-purple-900/50 text-purple-300 border-purple-700/40';
                    else if (card.funding === 'DEBIT') fundingBadge = 'bg-teal-900/50 text-teal-300 border-teal-700/40';
                    else if (card.funding === 'PREPAID') fundingBadge = 'bg-amber-900/50 text-amber-300 border-amber-700/40';

                    const cardFlag = `https://flagcdn.com/w40/${card.country.toLowerCase()}.png`;

                    cardCard.innerHTML = `
                        <!-- Card Top Metadata -->
                        <div class="flex items-center justify-between border-b border-gray-700/60 pb-2">
                            <div class="flex items-center space-x-2">
                                <img src="${cardFlag}" alt="${card.country}" class="w-5 h-3.5 object-cover rounded" onerror="this.src='https://placehold.co/40x30/374151/9CA3AF?text=?';">
                                <span class="font-bold text-xs text-gray-300">${card.country}</span>
                            </div>
                            <div class="flex items-center space-x-1">
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${brandBadge}">${card.brand}</span>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${fundingBadge}">${card.funding}</span>
                            </div>
                        </div>

                        <!-- Card Fields Interactive Buttons -->
                        <div class="space-y-2">
                            <!-- Card Number -->
                            <div>
                                <span class="text-[10px] text-gray-400 font-medium uppercase tracking-wider block mb-0.5">Card Number</span>
                                <button onclick="copySingleValue('${card.cardNumber}', 'Số thẻ')" 
                                    class="w-full text-left font-mono font-bold text-blue-400 bg-gray-900/80 hover:bg-blue-600/20 hover:text-blue-300 border border-gray-700 hover:border-blue-500/50 px-3 py-1.5 rounded-lg transition-all flex items-center justify-between group/btn" 
                                    title="Click để copy số thẻ">
                                    <span class="tracking-wider text-xs sm:text-sm">${formatCardNumber(card.cardNumber)}</span>
                                    <i class="fa-regular fa-copy text-xs text-gray-500 group-hover/btn:text-blue-400"></i>
                                </button>
                            </div>

                            <!-- Exp & CVC Row -->
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <span class="text-[10px] text-gray-400 font-medium uppercase tracking-wider block mb-0.5">Exp Date</span>
                                    <button onclick="copySingleValue('${card.expiration}', 'Ngày hết hạn')" 
                                        class="w-full text-left font-mono font-semibold text-emerald-400 bg-gray-900/80 hover:bg-emerald-600/20 hover:text-emerald-300 border border-gray-700 hover:border-emerald-500/50 px-2.5 py-1.5 rounded-lg transition-all flex items-center justify-between group/btn"
                                        title="Click để copy ngày hết hạn">
                                        <span class="text-xs sm:text-sm">${card.expiration}</span>
                                        <i class="fa-regular fa-copy text-xs text-gray-500 group-hover/btn:text-emerald-400"></i>
                                    </button>
                                </div>
                                <div>
                                    <span class="text-[10px] text-gray-400 font-medium uppercase tracking-wider block mb-0.5">CVC / CVV</span>
                                    <button onclick="copySingleValue('${card.cvc}', 'Mã CVC')" 
                                        class="w-full text-left font-mono font-semibold text-amber-400 bg-gray-900/80 hover:bg-amber-600/20 hover:text-amber-300 border border-gray-700 hover:border-amber-500/50 px-2.5 py-1.5 rounded-lg transition-all flex items-center justify-between group/btn"
                                        title="Click để copy CVC">
                                        <span class="text-xs sm:text-sm">${card.cvc}</span>
                                        <i class="fa-regular fa-copy text-xs text-gray-500 group-hover/btn:text-amber-400"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Holder Name & Segment -->
                            <div class="flex items-center justify-between text-[11px] text-gray-400 pt-1">
                                <span class="truncate max-w-[150px]" title="${card.holderName}"><i class="fa-regular fa-user text-gray-500"></i> ${card.holderName || 'N/A'}</span>
                                <span class="text-gray-400 font-medium bg-gray-900/60 px-1.5 py-0.5 rounded border border-gray-700/50 text-[10px]">${card.segmentType}</span>
                            </div>
                        </div>

                        <!-- Card Footer Pipe Copy -->
                        <div class="pt-2 border-t border-gray-700/50">
                            <button onclick="copyPipeFormat('${card.rawString}')" 
                                class="w-full py-1.5 bg-gray-700/50 hover:bg-blue-600 text-gray-200 hover:text-white font-medium text-xs rounded-lg border border-gray-600 hover:border-blue-500 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-copy"></i> Copy Pipe (num|exp|cvc)
                            </button>
                        </div>
                    `;

                    cardsGrid.appendChild(cardCard);
                });

                details.appendChild(summary);
                details.appendChild(cardsGrid);
                groupsContainer.appendChild(details);
            });
        }

        // Format 16 digits card number into 4-digit groups
        function formatCardNumber(num) {
            if (!num) return '';
            return num.replace(/\s?/g, '').replace(/(\d{4})/g, '$1 ').trim();
        }

        // Copy Single Item Handler
        function copySingleValue(val, label) {
            if (!val) return;
            copyToClipboard(val);
            showToast(`Đã copy ${label}: ${val}`);
        }

        // Copy Pipe Format Handler
        function copyPipeFormat(rawStr) {
            if (!rawStr) return;
            copyToClipboard(rawStr);
            showToast(`Đã copy Pipe: ${rawStr}`);
        }

        // Copy All Currently Displayed Cards
        btnCopyAllVisible.addEventListener('click', () => {
            const searchTerm = searchCard.value.trim().toLowerCase();
            let filteredCards = validCards.filter(c => c.cardNumber.toLowerCase().includes(searchTerm));
            
            if (filteredCards.length === 0) {
                showToast("Không có thẻ nào để copy!", true);
                return;
            }
            const copyText = filteredCards.map(c => c.rawString).join('\n');
            copyToClipboard(copyText);
            showToast(`Đã copy ${filteredCards.length} thẻ đang hiển thị!`);
        });

        // Escape helper for JS string inside inline HTML onclick
        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
        }

        // Copy Utility with ExecCommand Fallback
        function copyToClipboard(text) {
            const hiddenArea = document.getElementById('hidden-copy-area');
            hiddenArea.value = text;
            hiddenArea.select();
            hiddenArea.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
            } catch (err) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                }
            }
        }

        // Toast Notification Display
        let toastTimeout;
        function showToast(msg, isError = false) {
            toastMessage.textContent = msg;
            if (isError) {
                toast.classList.remove('bg-emerald-600');
                toast.classList.add('bg-rose-600');
            } else {
                toast.classList.remove('bg-rose-600');
                toast.classList.add('bg-emerald-600');
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
