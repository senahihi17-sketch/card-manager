<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Manager Tool</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/60 backdrop-blur-md">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
                    💳 Card Manager Pro
                </h1>
                <p class="text-slate-400 text-sm mt-1">Hệ thống quản lý, lọc, gom nhóm và xử lý thẻ thông minh</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="total-count-badge" class="px-3 py-1.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-xl text-sm font-medium">
                    Tổng số thẻ: 0
                </span>
            </div>
        </header>

        <!-- Stats & Notifications Banner -->
        <div id="stats-banner" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center gap-4">
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg text-xl">✅</div>
                <div>
                    <div class="text-slate-400 text-xs">Thẻ hợp lệ sử dụng</div>
                    <div id="stat-valid" class="text-xl font-bold text-emerald-400">0</div>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center gap-4">
                <div class="p-3 bg-amber-500/10 text-amber-400 rounded-lg text-xl">⏳</div>
                <div>
                    <div class="text-slate-400 text-xs">Đã loại bỏ (Hết hạn)</div>
                    <div id="stat-expired" class="text-xl font-bold text-amber-400">0</div>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center gap-4">
                <div class="p-3 bg-rose-500/10 text-rose-400 rounded-lg text-xl">🔄</div>
                <div>
                    <div class="text-slate-400 text-xs">Đã loại bỏ (Trùng lặp)</div>
                    <div id="stat-duplicate" class="text-xl font-bold text-rose-400">0</div>
                </div>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-8">
            <!-- Upload & Input Area -->
            <div class="lg:col-span-5 bg-slate-800/60 border border-slate-700/60 p-5 rounded-2xl flex flex-col justify-between">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">📁 Tải lên file .txt hoặc dán dữ liệu</label>
                    <div id="drop-zone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-xl p-4 text-center cursor-pointer transition bg-slate-900/40 relative">
                        <input type="file" id="file-input" accept=".txt" class="absolute inset-0 opacity-0 cursor-pointer">
                        <div class="text-slate-400 text-sm">
                            <span class="text-indigo-400 font-semibold">Chọn file txt</span> hoặc kéo thả file vào đây
                        </div>
                        <div id="file-name" class="text-xs text-emerald-400 mt-1 font-mono"></div>
                    </div>
                </div>
                <div class="mt-4">
                    <textarea id="raw-input" rows="3" placeholder="Hoặc dán danh sách thẻ tại đây (card_number|expiration|cvc|...)..." class="w-full bg-slate-900/60 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono"></textarea>
                    <button id="process-btn" class="mt-2 w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                        Xử lý & Lọc dữ liệu
                    </button>
                </div>
            </div>

            <!-- Search, Group & Filter Tools -->
            <div class="lg:col-span-7 bg-slate-800/60 border border-slate-700/60 p-5 rounded-2xl flex flex-col justify-between gap-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Search -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-300">🔍 Tìm kiếm số thẻ</label>
                        <input type="text" id="search-input" placeholder="Nhập 4-6 số đầu hoặc đầy đủ..." class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <!-- Group By -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-300">📂 Gom nhóm theo</label>
                        <select id="group-select" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="country" selected>Quốc gia (Country)</option>
                            <option value="funding">Loại thẻ (Funding)</option>
                            <option value="segment_type">Phân khúc (Segment Type)</option>
                            <option value="brand">Thương hiệu (Brand)</option>
                        </select>
                    </div>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-700/60">
                    <div class="flex items-center gap-2">
                        <button id="expand-all-btn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg transition text-slate-200 font-medium">Mở tất cả nhóm</button>
                        <button id="collapse-all-btn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg transition text-slate-200 font-medium">Đóng tất cả nhóm</button>
                    </div>
                    <div id="filter-status" class="text-xs text-indigo-400 font-medium">Đang sắp xếp cố định theo Country</div>
                </div>
            </div>
        </div>

        <!-- Main Display Container -->
        <main id="groups-container" class="space-y-4">
            <!-- Dynamic Groups will be injected here -->
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-slate-100 border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <span id="toast-icon" class="text-emerald-400">✨</span>
        <span id="toast-msg" class="text-sm font-medium">Đã copy thành công!</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let allCards = [];

        // Dữ liệu mẫu ban đầu để kiểm tra giao diện chạy trực tiếp
        const defaultRawData = ``;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('raw-input').value = defaultRawData;
            processData(defaultRawData);

            document.getElementById('process-btn').addEventListener('click', () => {
                const text = document.getElementById('raw-input').value;
                processData(text);
            });

            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                document.getElementById('file-name').innerText = `Đã chọn: ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const text = event.target.result;
                    document.getElementById('raw-input').value = text;
                    processData(text);
                };
                reader.readAsText(file);
            });

            document.getElementById('search-input').addEventListener('input', renderCards);
            document.getElementById('group-select').addEventListener('change', renderCards);
            document.getElementById('expand-all-btn').addEventListener('click', () => toggleAllGroups(true));
            document.getElementById('collapse-all-btn').addEventListener('click', () => toggleAllGroups(false));
        });

        function isCardExpired(expStr) {
            if (!expStr || !expStr.includes('/')) return false;
            const parts = expStr.split('/');
            let month = parseInt(parts[0], 10);
            let year = parseInt(parts[1], 10);
            if (isNaN(month) || isNaN(year)) return false;
            if (year < 100) year += 2000;

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            if (year < currentYear) return true;
            if (year === currentYear && month < currentMonth) return true;
            return false;
        }

        function processData(rawText) {
            const lines = rawText.split(/\r?\n/);
            let parsedCards = [];
            let expiredCount = 0;
            let duplicateCount = 0;
            const seenSet = new Set();

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                const cols = line.split('|');
                if (cols.length < 2) return;

                const card_number = cols[0].trim();
                const expiration = cols[1].trim();
                const cvc = (cols[2] || '').trim();
                const name = (cols[3] || '').trim();
                const country = (cols[4] || 'UN').toUpperCase().trim();
                const brand = (cols[5] || 'UNKNOWN').toUpperCase().trim();
                const funding = (cols[6] || 'UNKNOWN').toUpperCase().trim();
                const segment_type = (cols[7] || 'CONSUMER').toUpperCase().trim();

                // 1. Kiểm tra hết hạn theo tháng/năm Việt Nam
                if (isCardExpired(expiration)) {
                    expiredCount++;
                    return;
                }

                // 2. Kiểm tra trùng bộ 3: card_number|expiration|cvc
                const uniqueKey = `${card_number}|${expiration}|${cvc}`;
                if (seenSet.has(uniqueKey)) {
                    duplicateCount++;
                    return;
                }
                seenSet.add(uniqueKey);

                parsedCards.push({
                    card_number,
                    expiration,
                    cvc,
                    name,
                    country,
                    brand,
                    funding,
                    segment_type,
                    rawFormat: `${card_number}|${expiration}|${cvc}`
                });
            });

            allCards = parsedCards;

            // Cập nhật thống kê giao diện
            document.getElementById('stat-valid').innerText = allCards.length;
            document.getElementById('stat-expired').innerText = expiredCount;
            document.getElementById('stat-duplicate').innerText = duplicateCount;
            document.getElementById('total-count-badge').innerText = `Tổng số thẻ hợp lệ: ${allCards.length}`;

            renderCards();
        }

        function renderCards() {
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
            const groupBy = document.getElementById('group-select').value;

            let filtered = allCards.filter(card => {
                if (searchTerm && !card.card_number.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                return true;
            });

            // Gom nhóm
            const groups = {};
            filtered.forEach(card => {
                let key = card[groupBy] || 'OTHER';
                if (!groups[key]) groups[key] = [];
                groups[key].push(card);
            });

            // Sắp xếp các nhóm (Mặc định cố định theo Country hoặc key A-Z)
            const sortedKeys = Object.keys(groups).sort();

            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            if (sortedKeys.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-700">Không tìm thấy thẻ phù hợp.</div>`;
                return;
            }

            sortedKeys.forEach((groupKey, index) => {
                const cardsInGroup = groups[groupKey];
                const groupCardId = `group-card-${index}`;

                // Tạo tiêu đề hiển thị kèm cờ nếu là country
                let groupTitleHTML = groupKey;
                if (groupBy === 'country') {
                    groupTitleHTML = `
                        <div class="flex items-center gap-2">
                            <img src="https://flagcdn.com/w40/${groupKey.toLowerCase()}.png" class="w-6 h-4 object-cover rounded shadow" onerror="this.style.display='none'">
                            <span>Quốc gia: ${groupKey}</span>
                        </div>
                    `;
                } else {
                    groupTitleHTML = `<span>${groupBy.toUpperCase()}: ${groupKey}</span>`;
                }

                // Gom toàn bộ chuỗi thẻ của nhóm này để copy nhanh
                const groupRawBatch = cardsInGroup.map(c => c.rawFormat).join('\n');

                const groupEl = document.createElement('div');
                groupEl.className = 'bg-slate-800/70 border border-slate-700/80 rounded-2xl overflow-hidden shadow-lg';
                groupEl.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between px-5 py-4 bg-slate-800/90 border-b border-slate-700/60 cursor-pointer select-none group-header" data-target="${groupCardId}">
                        <div class="flex items-center gap-3">
                            ${groupTitleHTML}
                            <span class="px-2.5 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs rounded-full font-semibold">${cardsInGroup.length} thẻ</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="event.stopPropagation(); copyText('${encodeURIComponent(groupRawBatch)}', 'Đã copy toàn bộ ${cardsInGroup.length} thẻ của nhóm ${groupKey}!')" class="px-3 py-1 bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs font-semibold rounded-lg transition">
                                Copy cả nhóm
                            </button>
                            <span class="text-slate-400 transform transition-transform duration-200 arrow-icon font-bold">▼</span>
                        </div>
                    </div>
                    <div id="${groupCardId}" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${cardsInGroup.map(c => `
                            <div class="bg-slate-900/70 border border-slate-700/60 hover:border-indigo-500/60 rounded-xl p-3 flex flex-col justify-between transition group/card relative">
                                <div>
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="font-mono text-sm font-bold text-indigo-300 tracking-wider cursor-pointer hover:text-white" onclick="copyText('${c.card_number}', 'Đã copy số thẻ!')" title="Click để copy số thẻ">${c.card_number}</span>
                                        <span class="text-[10px] uppercase px-2 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300">${c.brand}</span>
                                    </div>
                                    <div class="flex items-center gap-4 text-xs text-slate-400 font-mono mb-2">
                                        <div>Exp: <span class="text-slate-200 cursor-pointer hover:text-indigo-400" onclick="copyText('${c.expiration}', 'Đã copy expiration!')" title="Click copy">${c.expiration}</span></div>
                                        <div>CVC: <span class="text-slate-200 cursor-pointer hover:text-indigo-400" onclick="copyText('${c.cvc}', 'Đã copy CVC!')" title="Click copy">${c.cvc}</span></div>
                                    </div>
                                </div>
                                <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
                                    <span class="truncate max-w-[120px]" title="${c.name}">${c.name || 'N/A'}</span>
                                    <div class="flex items-center gap-1.5 font-semibold">
                                        <span class="text-cyan-400">${c.funding}</span> • <span class="text-amber-400">${c.segment_type}</span>
                                    </div>
                                </div>
                                <button onclick="copyText('${c.rawFormat}', 'Đã copy định dạng card|exp|cvc!')" class="absolute top-2 right-2 opacity-0 group-hover/card:opacity-100 transition px-2 py-1 bg-indigo-600 text-white text-[10px] rounded shadow">
                                    Copy chuỗi
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;

                // Sự kiện click để đóng mở Accordion
                const header = groupEl.querySelector('.group-header');
                const content = groupEl.querySelector(`#${groupCardId}`);
                const arrow = groupEl.querySelector('.arrow-icon');
                header.addEventListener('click', () => {
                    content.classList.toggle('hidden');
                    arrow.style.transform = content.classList.contains('hidden') ? 'rotate(-90deg)' : 'rotate(0deg)';
                });

                container.appendChild(groupEl);
            });
        }

        function toggleAllGroups(open) {
            document.querySelectorAll('#groups-container > div').forEach(groupEl => {
                const content = groupEl.querySelector('[id^="group-card-"]');
                const arrow = groupEl.querySelector('.arrow-icon');
                if (open) {
                    content.classList.remove('hidden');
                    arrow.style.transform = 'rotate(0deg)';
                } else {
                    content.classList.add('hidden');
                    arrow.style.transform = 'rotate(-90deg)';
                }
            });
        }

        function copyText(text, message) {
            const decoded = decodeURIComponent(text);
            navigator.clipboard.writeText(decoded).then(() => {
                showToast(message);
            }).catch(err => {
                console.error('Không thể copy: ', err);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
